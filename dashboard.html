<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Personal Finance Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
/* Layout: bento dashboard. Phone 1 col, tablet 2, laptop 3. Hero (this month), goal, accounts, subscriptions, daily chart, categories, Ask AI, activity, growth calculator. Floating Add button opens a sheet (bottom on phone, centred window on bigger screens). */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --ink:#0b1b3a; --muted:#5b6b8a; --faint:#8a97b0; --line:#e1e7f1; --grid:#edf1f8;
  --accent:#0055fe; --accent-ink:#ffffff; --accent-soft:#eaf1ff; --bar:#0055fe; --track:#e8edf6; --inv:#e8890c; --inv-soft:#fff3e2; --cpf:#0f9b8e; --ins:#8b4fd6;
  --hero:#0b1b3a; --hero-ink:#eef3ff; --hero-muted:#9fb2d6; --lime:#7fb0ff;
  --good:#0e7a54; --good-soft:#e3f5ee; --warn:#b4400e; --warn-soft:#fdeee6; --chip:#ebeff7;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d1c; --surface:#0f1830; --ink:#e9efff; --muted:#93a2c4; --faint:#6b7a9c; --line:#1d2947; --grid:#16213b;
  --accent:#5b8cff; --accent-ink:#04102e; --accent-soft:#132552; --bar:#5b8cff; --track:#18243f; --inv:#cc7d1a; --inv-soft:#33240f; --cpf:#16998c; --ins:#a679e8;
  --hero:#0f2552; --hero-ink:#eef3ff; --hero-muted:#9fb2d6; --lime:#8fbaff;
  --good:#4fd1a1; --good-soft:#12302a; --warn:#ff9a6b; --warn-soft:#3a1f14; --chip:#18243f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070d1c; --surface:#0f1830; --ink:#e9efff; --muted:#93a2c4; --faint:#6b7a9c; --line:#1d2947; --grid:#16213b;
  --accent:#5b8cff; --accent-ink:#04102e; --accent-soft:#132552; --bar:#5b8cff; --track:#18243f; --inv:#cc7d1a; --inv-soft:#33240f; --cpf:#16998c; --ins:#a679e8;
  --hero:#0f2552; --hero-ink:#eef3ff; --hero-muted:#9fb2d6; --lime:#8fbaff;
  --good:#4fd1a1; --good-soft:#12302a; --warn:#ff9a6b; --warn-soft:#3a1f14; --chip:#18243f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font:800 18px var(--display);font-style:normal}
.logo b{display:block;font-family:var(--display);font-size:19px;line-height:1}
.logo span{display:block;font-size:12px;color:var(--muted)}
.topbtns{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:600 13px var(--body);padding:8px 12px;cursor:pointer;white-space:nowrap}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.months button{flex:none;border:0;background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.banner button{border:0;background:var(--warn);color:#fff;border-radius:999px;padding:7px 12px;font:700 13px var(--body);cursor:pointer}
.bento{display:grid;grid-template-columns:1fr;gap:12px}
.tile{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile h2{margin:0;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile h2 button{text-transform:none;letter-spacing:0}
.hero{background:var(--hero);color:var(--hero-ink)}
.hero h2{color:var(--hero-muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,64px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--hero-muted);font-weight:600;letter-spacing:0}
.meter{height:12px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;border-radius:12px;background:var(--lime)}
.meter.over i{background:#ff8a65}
.hrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hrow div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px;min-width:0}
.hrow b{display:block;font-family:var(--display);font-size:clamp(15px,4.4vw,21px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow span{font-size:11.5px;color:var(--hero-muted)}
@media (max-width:420px){.hrow{grid-template-columns:1fr 1fr}}
.allow{font-size:15px;color:var(--hero-ink)}
.allow b{color:var(--lime)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--faint);font:500 10px var(--mono)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,-110%);z-index:2}
.tip span{display:block;font-weight:500;opacity:.75;font-size:11px}
.cats{display:flex;flex-direction:column;gap:9px}
.cat{display:grid;grid-template-columns:28px minmax(0,1fr) max-content;gap:10px;align-items:center}
.em{width:28px;height:28px;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.cat .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.cat .nm span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.cat .tr{height:8px;background:var(--track);border-radius:4px;margin-top:4px;overflow:hidden}
.cat .tr i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.goal{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.ring circle{fill:none;stroke-width:10}
.goal b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.goal p{margin:2px 0 0;color:var(--muted);font-size:13px}
.si{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.si:first-child{border-top:0}
.si span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.subtotal{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.nw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nw div{background:var(--chip);border-radius:14px;padding:10px;min-width:0}
.nw div:first-child{background:var(--hero);color:var(--hero-ink)}
.nw .nwbig{grid-column:1/-1}.nw .nwbig b{font-size:clamp(24px,7vw,34px)}
.nw span{display:block;font-size:12px;opacity:.75}
.nw b{display:block;font-family:var(--display);font-size:clamp(15px,4.2vw,23px);font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
@media (max-width:520px){.nw{grid-template-columns:1fr 1fr}}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.mix i{display:block;height:100%;background:var(--accent)}
.mix i.inv{background:var(--inv)}.mix i.cpf{background:var(--cpf)}.mix i.ins{background:var(--ins)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);vertical-align:-1px;margin-right:6px}
.legend i.inv{background:var(--inv)}.legend i.cpf{background:var(--cpf)}.legend i.ins{background:var(--ins)}
.legend i.line{width:18px;height:0;border-radius:0;background:none;border-top:3px solid var(--accent);vertical-align:middle}
.legend i.dash{width:18px;height:0;border-radius:0;background:none;border-top:2px dashed var(--faint);vertical-align:middle}
.grp{margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.acct{display:grid;grid-template-columns:34px minmax(0,1fr) max-content;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 0;cursor:pointer;font:inherit}
.acct .em{width:34px;height:34px;border-radius:11px}
.acct b{display:block;font-size:14px}
.acct small{display:block;font-size:12px;color:var(--muted)}
.acct small.stale{color:var(--warn);font-weight:600}
.acct .r{text-align:right}
.acct .r small.up{color:var(--good);font-weight:600}
.acct .r small.down{color:var(--warn);font-weight:600}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typegrid button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:9px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.typegrid button span{font-size:18px}
.typegrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:420px){.typegrid{grid-template-columns:repeat(2,1fr)}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--chip);border-radius:12px;padding:10px;min-width:0}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-variant-numeric:tabular-nums}
.ai{background:linear-gradient(150deg,var(--accent-soft),var(--surface))}
.ai p{margin:0;color:var(--muted);font-size:14px}
.ai .go{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--body);padding:11px 18px;border-radius:999px;cursor:pointer}
.ai pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.5 var(--mono);white-space:pre-wrap;max-height:180px;overflow:auto}
.txi{display:grid;grid-template-columns:34px minmax(0,1fr) max-content;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.txi:first-child{border-top:0}
.txi .em{width:34px;height:34px;border-radius:11px}
.txi .t{min-width:0}
.txi .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txi .t span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txi .a{font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-wrap:nowrap;align-items:center;gap:4px;white-space:nowrap}
.txi .a.in{color:var(--good)}
.txi .a.mv{color:var(--muted)}
.del{border:0;background:none;color:var(--faint);font-size:16px;cursor:pointer;padding:4px}
.empty{color:var(--muted);font-size:14px;margin:0}
.calc .inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fv{display:flex;flex-direction:column;gap:2px}
.fv .n{font-family:var(--display);font-weight:800;font-size:clamp(38px,10vw,52px);line-height:1;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.fv p{margin:0;color:var(--muted);font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split div{background:var(--chip);border-radius:14px;padding:10px;min-width:0}
.split b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.split span{font-size:12px;color:var(--muted)}
.disc{margin:0;font-size:12px;color:var(--faint)}
.rates{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:0 4px 0 0}
.rchip button{border:0;background:none;color:inherit;font:600 13px var(--body);cursor:pointer;border-radius:999px}
.rchip [data-rid]{padding:7px 4px 7px 12px}
.rchip .rx{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;color:var(--faint);padding:0}
.rchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rchip.on .rx{color:var(--accent-ink)}
.newrate{border:1.5px dashed var(--line);background:none;color:var(--accent);font:700 13px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.stepper{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--chip);color:var(--ink);font:700 18px var(--body);width:40px;cursor:pointer;flex:none}
.stepper input{border:0!important;border-radius:0!important;text-align:center;font-weight:700}
.cta{background:linear-gradient(150deg,#0b1b3a,#0055fe);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px}
.cta h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.cta p{margin:0;opacity:.9;font-size:14px}
.ctab{align-self:flex-start;border:0;background:#fff;color:#0b1b3a;font:700 14px var(--body);padding:11px 18px;border-radius:999px;cursor:pointer}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);font:700 17px var(--body);border-radius:999px;padding:16px 22px;box-shadow:0 10px 30px rgba(0,40,140,.3);cursor:pointer;z-index:5}
.zak .zl{display:flex;flex-direction:column}
.zrow{display:grid;grid-template-columns:22px minmax(0,1fr) max-content;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.zrow:first-child{border-top:0}
.zrow input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.zrow b{display:block;font-size:14px;font-weight:600}
.zrow small{display:block;font-size:12px;color:var(--muted)}
.zrow.off b,.zrow.off .amt{color:var(--faint)}
.zres{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.zres .n{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,46px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.zres p{margin:0;font-size:14px;color:var(--ink)}
.zres.no{background:var(--chip)}.zres.no .n{color:var(--muted)}
.zchk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.zchk input{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0;flex:none}
details.why summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.why ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
/* sheet */
.sheetwrap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.sheetbg{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(5,12,30,.5)}
.sheet{position:relative;background:var(--surface);overflow:auto;width:100%;border-radius:24px 24px 0 0;max-height:88vh;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-size:24px;line-height:1.15}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 14px var(--body);padding:9px 6px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.amt-in{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amt-in span{font:800 34px var(--display);color:var(--muted)}
.amt-in input{border:0;background:none;color:var(--ink);font:800 44px var(--display);width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field textarea,.field select{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px;font:15px var(--body);width:100%;min-width:0}
.field textarea{min-height:140px;font:12.5px/1.5 var(--mono);white-space:pre}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.save{border:0;background:var(--accent);color:var(--accent-ink);font:700 17px var(--body);border-radius:16px;min-height:54px;cursor:pointer}
.save:disabled{opacity:.4;cursor:default}
.note{margin:0;font-size:13px;color:var(--muted)}
.err{margin:0;font-size:13px;color:var(--warn);font-weight:600}
.danger{border:1.5px solid var(--warn);background:none;color:var(--warn);font:700 14px var(--body);border-radius:14px;padding:12px;cursor:pointer}
.abig{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--body);border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center}
.actions button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--muted)}
.pill.up{background:var(--good-soft);color:var(--good)}.pill.down{background:var(--warn-soft);color:var(--warn)}
.person{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:18px;padding:14px}
.person .who{display:flex;gap:12px;align-items:center}
.person .av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font:800 20px var(--display);flex:none}
.person b{display:block;font-family:var(--display);font-size:20px}
.person .role{font-size:13px;color:var(--muted)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:8px 8px 8px 12px}

function blank(){return {v:2,example:false,budget:1500,goals:[],recur:[],catBudget:{},accounts:[],tx:[],rates:[],lastFrom:null};}
function migrate(o){if(!o.goals){o.goals=o.goal?[{id:uid(),name:o.goal.name,target:o.goal.target,saved:o.goal.saved||0,by:''}]:[];delete o.goal;}if(!o.recur)o.recur=[];if(!o.catBudget)o.catBudget={};return o;}
function load(){var o=null;try{var s=localStorage.getItem(KEY);if(s){o=JSON.parse(s);if(!(o&&o.tx&&o.accounts))o=null;else migrate(o);}}catch(_){}return o||example();}

function nextYm(m){var y=+m.slice(0,4),mo=+m.slice(5,7)+1;if(mo>12){mo=1;y++;}return y+'-'+String(mo).padStart(2,'0');}
function runRecur(){var cur=ym(today()),td=new Date().getDate(),n=0;(D.recur||[]).forEach(function(r){if(r.off)return;var m=r.last?nextYm(r.last):r.start,g=0;
  while(m<=cur&&g++<240){var y=+m.slice(0,4),mo=+m.slice(5,7),day=Math.min(r.day,new Date(y,mo,0).getDate());if(m===cur&&day>td)break;
    var t={id:uid(),kind:r.kind,date:m+'-'+String(day).padStart(2,'0'),amt:r.amt,note:r.note,rid:r.id};if(r.kind==='spend'){t.cat=r.cat;t.from=r.from||null;}else if(r.kind==='income'){t.to=r.to;t.src=r.src;}else{t.from=r.from;t.to=r.to;}
    D.tx.push(t);r.last=m;n++;m=nextYm(m);}});if(n)persist();return n;}
runRecur();

function acc(id){for(var i=0;i<D.accounts.length;i++)if(D.accounts[i].id===id)return D.accounts[i];return null;}
function aname(id){var a=acc(id);return a?a.name:'No account';}
function openAccts(types){return D.accounts.filter(function(a){return !a.closed&&(!types||types.indexOf(a.type)>-1);});}
function balances(){
  var b={},grow={};D.accounts.forEach(function(a){b[a.id]=a.open;grow[a.id]=0;});
  D.tx.forEach(function(t){
    if(t.kind==='spend'){if(t.from in b)b[t.from]-=t.amt;}
    else if(t.kind==='income'){if(t.to in b)b[t.to]+=t.amt;}
    else if(t.kind==='move'){if(t.from in b)b[t.from]-=t.amt;if(t.to in b)b[t.to]+=t.amt;}
    else if(t.kind==='dividend'){if(t.to in b)b[t.to]+=t.amt;if(t.acc in grow)grow[t.acc]+=t.amt;}
    else if(t.kind==='value'||t.kind==='adjust'){if(t.acc in b)b[t.acc]+=t.amt;if(t.kind==='value'&&t.acc in grow)grow[t.acc]+=t.amt;}
  });
  Object.keys(b).forEach(function(k){b[k]=r2(b[k]);grow[k]=r2(grow[k]);});
  return {b:b,grow:grow};
}
function lastActivity(id){var d=null;D.tx.forEach(function(t){if(t.from===id||t.to===id||t.acc===id){if(!d||t.date>d)d=t.date;}});var a=acc(id);return d||(a&&a.openDate)||today();}

  var total=0,by={},income=0,div=0;spends.forEach(function(t){total+=t.amt;by[t.cat]=(by[t.cat]||0)+t.amt;});
  var cpfIn=0;tx.forEach(function(t){if(t.kind==='income'){var ta=acc(t.to);if(ta&&ta.type==='cpf')cpfIn+=t.amt;else income+=t.amt;}if(t.kind==='dividend')div+=t.amt;});
  var y=+m.slice(0,4),mo=+m.slice(5,7)-1,dim=new Date(y,mo+1,0).getDate(),now=new Date();
  var isNow=now.getFullYear()===y&&now.getMonth()===mo,dayNow=isNow?now.getDate():dim;
  var daily=[];for(var i=1;i<=dim;i++)daily.push(0);spends.forEach(function(t){daily[+t.date.slice(8,10)-1]+=t.amt;});
  return{tx:tx,spends:spends,total:total,by:by,income:income,cpfIn:cpfIn,div:div,dim:dim,dayNow:dayNow,isNow:isNow,daily:daily,y:y,mo:mo};

var CW={d:340,g:340,l:340};

  var W=CW.d,H=Math.round(Math.max(130,Math.min(200,W*.38))),pl=4,pr=4,pt=8,pb=18,iw=W-pl-pr,ih=H-pt-pb,max=Math.max.apply(null,st.daily.concat([1]));
  var nice=Math.ceil(max/50)*50,bw=iw/st.dim,g='';
  [0.5,1].forEach(function(f){var y=pt+ih-ih*f;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/><text x="'+(W-pr)+'" y="'+(y-3)+'" text-anchor="end">'+$(nice*f)+'</text>';});
  st.daily.forEach(function(v,i){var h=v?Math.max(3,ih*v/nice):0,x=pl+i*bw+1,w=Math.max(2,bw-2),y=pt+ih-h,rr=Math.min(4,h,w/2),hot=st.isNow&&i+1===st.dayNow;
    if(h)g+='<path d="M'+x+','+(pt+ih)+'V'+(y+rr)+'q0,-'+rr+' '+rr+',-'+rr+'H'+(x+w-rr)+'q'+rr+',0 '+rr+','+rr+'V'+(pt+ih)+'Z" fill="var(--bar)" opacity="'+(hot?1:.8)+'"/>';
    g+='<rect class="hit" data-d="'+(i+1)+'" x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>';});
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'" stroke="var(--line)"/>';
  [1,10,20,st.dim].forEach(function(dd){g+='<text x="'+(pl+(dd-.5)*bw)+'" y="'+(H-4)+'" text-anchor="middle">'+dd+'</text>';});
  return '<div class="chart" id="dchart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending per day">'+g+'</svg><div class="tip" id="dtip" hidden></div></div>';

/* ---------- loan payoff planner (v11) ----------
 Month by month: interest is added, every loan gets its own repayment, then any money left over
 (extra + repayments freed by loans already paid off) goes to one loan at a time:
 highest rate first ("rate") or smallest balance first ("small"). Estimate only. */
function loanList(B){return openAccts(['loan','mortgage','card']).filter(function(a){return a.type!=='card'||a.pay>0||a.rate>0;}).map(function(a){return {id:a.id,name:a.name,type:a.type,bal:r2(Math.max(0,-B.b[a.id])),rate:a.rate||0,pay:a.pay||0};}).filter(function(l){return l.bal>0.005;});}
function simulate(loans,extra,strat){
  var L=loans.map(function(l){return {id:l.id,name:l.name,bal:l.bal,rate:l.rate,pay:l.pay,done:null};}),budget=L.reduce(function(x,l){return x+l.pay;},0)+(extra||0),m=0,interest=0,tot=function(){return L.reduce(function(x,l){return x+l.bal;},0);},series=[tot()],order=[];
  if(!(budget>0)||!L.length)return {never:L.length>0,months:0,interest:0,series:series,order:order};
  while(tot()>0.005&&m<1200){m++;
    L.forEach(function(l){if(l.bal>0){var i=l.bal*l.rate/1200;l.bal+=i;interest+=i;}});
    var pool=budget;
    L.forEach(function(l){if(l.bal>0&&pool>0){var p=Math.min(l.pay,l.bal,pool);l.bal-=p;pool-=p;}});
    L.filter(function(l){return l.bal>0.005;}).sort(strat==='small'?function(a,b){return a.bal-b.bal;}:function(a,b){return b.rate-a.rate||a.bal-b.bal;}).forEach(function(l){if(pool>0){var p=Math.min(pool,l.bal);l.bal-=p;pool-=p;}});
    L.forEach(function(l){if(l.bal<=0.005&&l.done==null){l.bal=0;l.done=m;order.push({id:l.id,name:l.name,m:m});}});
    series.push(tot());
  }
  return {never:tot()>0.005,months:m,interest:r2(interest),series:series,order:order};
}
function amort(bal,rate,n){var r=rate/1200;return r?bal*r/(1-Math.pow(1+r,-n)):bal/n;}
function mWhen(n){var d=new Date();d=new Date(d.getFullYear(),d.getMonth()+n,1);return MON[d.getMonth()]+' '+d.getFullYear();}
function mLen(n){var y=Math.floor(n/12),mm=n%12;return (y?y+' yr'+(y===1?'':'s'):'')+(y&&mm?' ':'')+(mm?mm+' mth':'')||'0 mth';}
function lp(){if(!D.lp)D.lp={sel:'all',mode:'pay',strat:'rate',extra:200,M:null,yrs:null};return D.lp;}
function lpResult(){
  var P=lp(),L=loanList(balances()),one=P.sel!=='all'?L.filter(function(l){return l.id===P.sel;})[0]:null;if(P.sel!=='all'&&!one){P.sel='all';}
  var set=one?[one]:L,base=simulate(set,0,P.strat),out={L:L,one:one,set:set,base:base};
  var minPay=one?Math.max(1,Math.ceil(one.bal*one.rate/1200)+1):0;
  if(P.mode==='date'){var yrs=P.yrs||Math.max(1,Math.min(30,Math.round((base.never?120:base.months)/12/2)||1)),n=yrs*12;P.yrs=yrs;
    if(one){out.pay=Math.ceil(amort(one.bal,one.rate,n));out.extra=0;out.plan=simulate([{id:one.id,name:one.name,bal:one.bal,rate:one.rate,pay:out.pay}],0,P.strat);}
    else{var lo=0,hi=set.reduce(function(x,l){return x+l.bal;},0);for(var i=0;i<40;i++){var mid=(lo+hi)/2,s=simulate(set,mid,P.strat);if(!s.never&&s.months<=n)hi=mid;else lo=mid;}out.extra=Math.ceil(hi);out.plan=simulate(set,out.extra,P.strat);out.pay=set.reduce(function(x,l){return x+l.pay;},0)+out.extra;}
  } else {
    if(one){var M=P.M!=null?P.M:Math.max(one.pay||0,minPay);out.pay=M;out.extra=0;out.plan=simulate([{id:one.id,name:one.name,bal:one.bal,rate:one.rate,pay:M}],0,P.strat);}
    else{out.extra=P.extra||0;out.plan=simulate(set,out.extra,P.strat);out.pay=set.reduce(function(x,l){return x+l.pay;},0)+out.extra;}
  }
  out.minPay=minPay;return out;
}
function loanChart(base,plan){
  var W=CW.l,H=Math.round(Math.max(160,Math.min(240,W*.42))),pl=4,pr=4,pt=10,pb=18,iw=W-pl-pr,ih=H-pt-pb;
  var bs=base.never?base.series.slice(0,Math.max(plan.series.length*2,13)):base.series,n=Math.max(bs.length,plan.series.length)-1||1,max=Math.max(bs[0]||1,1);
  var step=Math.pow(10,Math.floor(Math.log10(max))),nice=Math.ceil(max/step)*step;
  function X(i){return pl+iw*i/n;}function Y(v){return pt+ih-ih*Math.max(0,v)/nice;}
  var g='';[0.5,1].forEach(function(f){var y=Y(nice*f);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/><text x="'+(W-pr)+'" y="'+(y-3)+'" text-anchor="end">'+$(nice*f)+'</text>';});
  function pts(s){var k=Math.max(1,Math.ceil(s.length/300)),o=[];for(var i=0;i<s.length;i+=k)o.push(X(i)+','+Y(s[i]));o.push(X(s.length-1)+','+Y(s[s.length-1]));return o.join(' ');}
  g+='<path d="M'+X(0)+','+Y(0)+'L'+pts(plan.series).split(' ').join('L')+'L'+X(plan.series.length-1)+','+Y(0)+'Z" fill="var(--accent)" opacity=".12"/>';
  g+='<polyline points="'+pts(bs)+'" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 4"/>';
  g+='<polyline points="'+pts(plan.series)+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  if(!plan.never)g+='<circle cx="'+X(plan.series.length-1)+'" cy="'+Y(0)+'" r="5" fill="var(--good)" stroke="var(--surface)" stroke-width="2"/>';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'" stroke="var(--line)"/>';
  var ny=n/12,ticks=ny<=1?[0,n]:[0,Math.round(n/2),n];ticks.forEach(function(t){g+='<text x="'+Math.min(W-16,Math.max(12,X(t)))+'" y="'+(H-4)+'" text-anchor="middle">'+(t===0?'Now':ny<=2?t+'m':Math.round(t/12)+'y')+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Amount owed over time">'+g+'</svg>';
}
function lpOut(R){
  var P=lp(),b=R.base,p=R.plan,h='';
  if(p.never){h+='<div class="lres bad"><span class="n">Never paid off</span><p>'+(R.one?'At '+$(R.pay)+' a month the interest ('+$(Math.ceil(R.one.bal*R.one.rate/1200))+' a month) eats the whole repayment. Pay more than that.':'The repayments do not cover the interest. Add the missing repayments above or add extra.')+'</p></div>';return h;}
  var saved=b.never?null:r2(b.interest-p.interest),sooner=b.never?null:b.months-p.months;
  h+='<div class="lres"><span class="n">Debt-free by '+mWhen(p.months)+'</span><p>'+(R.one?'Paying <b>'+$(R.pay)+' a month</b>':'Paying <b>'+$(R.pay)+' a month</b> in total'+(R.extra?' ('+$(R.extra)+' extra)':''))+', '+esc(R.one?R.one.name:'all your loans')+' '+(R.one?'is':'are')+' gone in <b>'+mLen(p.months)+'</b>.</p></div>';
  h+='<div class="split3"><div><b>'+$(p.interest)+'</b><span>interest you still pay</span></div><div class="good"><b>'+(saved==null?'-':saved>0?$(saved):'$0')+'</b><span>interest saved'+(b.never?' (never paid off now)':'')+'</span></div><div class="good"><b>'+(sooner==null?'-':sooner>0?mLen(sooner):'0 mth')+'</b><span>sooner than now</span></div></div>';
  h+='<div class="legend"><span><i class="line"></i>With this plan</span><span><i class="dash"></i>At today\'s repayments</span></div><div id="lChartWrap" class="chart">'+loanChart(b,p)+'</div>';
  if(!R.one&&p.order.length>1)h+='<p class="grp">Paid off in this order</p><ol class="order">'+p.order.map(function(o,i){return '<li><i>'+(i+1)+'</i><span>'+esc(o.name)+'</span><em>'+mWhen(o.m)+'</em></li>';}).join('')+'</ol>';
  if(R.one){var cur=acc(R.one.id);if(cur&&Math.round(cur.pay||0)!==Math.round(R.pay))h+='<button class="save" type="button" id="lpUse">Make '+$(R.pay)+' my monthly repayment</button><p class="note">This only changes the plan here. Ask your bank first: some loans charge a fee for paying early.</p>';}
  else h+='<p class="note">'+(P.strat==='small'?'Smallest loan first: you clear a loan sooner, which keeps you going.':'Highest interest first: every extra dollar goes where it costs you the most, so you pay the least interest.')+' Ask your bank if paying early has a fee.</p>';
  return h;

  else {var base=R.set.reduce(function(x,l){return x+l.pay;},0);h+='<div class="slid"><span class="flabel">On top of my '+$(base)+' repayments, I add</span><div class="sv"><input type="range" id="lRange" min="0" max="'+Math.max(2000,Math.ceil(base/100)*100)+'" step="10" value="'+R.extra+'" aria-label="Extra each month"><div class="numbox"><span>$</span><input id="lNum" inputmode="decimal" value="'+R.extra+'" aria-label="Extra each month"></div></div></div>'+

}

/* ---------- growth calculator ---------- */
function grow(start,monthly,rate,years){
  var r=rate/100/12,bal=start,put=start,pts=[{y:0,bal:bal,put:put}];
  for(var m=1;m<=years*12;m++){bal=r?bal*(1+r)+monthly:bal+monthly;put+=monthly;if(m%12===0)pts.push({y:m/12,bal:bal,put:put});}
  return pts;
}
function calcDefaults(){
  if(!D.calc){var B=balances(),inv=openAccts(['invest']).reduce(function(x,a){return x+B.b[a.id];},0),st=stats(ym(today())),left=D.budget-st.total,mo=Math.max(50,Math.floor(Math.max(0,left)/50)*50);
    var r0=(D.rates&&D.rates[0])||null;D.calc={start:Math.round(inv||goalsSaved()||0),monthly:mo,rate:r0?r0.r:4,rateId:r0?r0.id:null,years:10};}
  return D.calc;
}
function money(n){return isFinite(n)&&Math.abs(n)<1e15?$(n):'Too big to show';}
function growChart(pts){
  var W=CW.g,H=Math.round(Math.max(170,Math.min(260,W*.45))),pl=4,pr=4,pt=10,pb=18,iw=W-pl-pr,ih=H-pt-pb,n=pts.length-1;
  var max=Math.max.apply(null,pts.map(function(p){return isFinite(p.bal)?Math.max(p.bal,p.put):0;}))||1,min=Math.min(0,Math.min.apply(null,pts.map(function(p){return isFinite(p.bal)?p.bal:0;})));
  var step=Math.pow(10,Math.floor(Math.log10(Math.max(1,max)))),nice=Math.ceil(max/step)*step||1;
  function X(i){return pl+iw*i/n;}function Y(v){v=isFinite(v)?v:nice;return pt+ih-ih*(v-min)/((nice-min)||1);}
  var g='';[0.5,1].forEach(function(f){var v=min+(nice-min)*f,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/><text x="'+(W-pr)+'" y="'+(y-3)+'" text-anchor="end">'+money(v)+'</text>';});
  g+='<path d="M'+X(0)+','+Y(min)+pts.map(function(p,i){return 'L'+X(i)+','+Y(p.bal);}).join('')+'L'+X(n)+','+Y(min)+'Z" fill="var(--accent)" opacity=".12"/>';
  g+='<polyline points="'+pts.map(function(p,i){return X(i)+','+Y(p.put);}).join(' ')+'" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 4"/>';
  g+='<polyline points="'+pts.map(function(p,i){return X(i)+','+Y(p.bal);}).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  g+='<circle cx="'+X(n)+'" cy="'+Y(pts[n].bal)+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(pt+ih)+'" y2="'+(pt+ih)+'" stroke="var(--line)"/>';
  (n<=5?pts.map(function(p){return p.y;}):[0,Math.round(n/2),n]).forEach(function(t){g+='<text x="'+Math.min(W-14,Math.max(10,X(t)))+'" y="'+(H-4)+'" text-anchor="middle">'+(t===0?'Now':t+'y')+'</text>';});
  g+='<line id="gx" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" stroke="var(--muted)" opacity="0"/><rect x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="transparent"/>';
  return '<div class="chart" id="gchart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Savings growth over '+n+' years">'+g+'</svg><div class="tip" id="gtip" hidden></div></div>';
}
function yl(n){return n+' year'+(n===1?'':'s');}
function needMonthly(c){var n=c.years*12,r=c.rate/100/12,t=c.target||0,s=c.start||0,m=r?(t-s*Math.pow(1+r,n))*r/(Math.pow(1+r,n)-1):(t-s)/n;return isFinite(m)?Math.max(0,Math.ceil(m)):0;}

function wireGrow(pts){
  var c=document.getElementById('gchart');if(!c)return;var tip=document.getElementById('gtip'),gx=document.getElementById('gx'),svg=c.querySelector('svg'),n=pts.length-1,VW=svg.viewBox.baseVal.width;
  function at(e){var r=svg.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width*VW,i=Math.round((fx-4)/(VW-8)*n);i=Math.max(0,Math.min(n,i));
    var x=4+(VW-8)*i/n;gx.setAttribute('x1',x);gx.setAttribute('x2',x);gx.setAttribute('opacity','.5');

/* ---------- bank paste ---------- */
var MONEY=/-?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}|-?\$?\s?\d+\.\d{2}/g;
var INCOME=/\bCR\b|SALARY|INTEREST CREDIT|REFUND|CASHBACK/i;
var DMY=/\b(\d{1,2})[\/\-\s](\d{1,2}|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:[\/\-\s](\d{2,4}))?\b/i;
function parsePaste(text,accId){
  var out=[],now=new Date();
  String(text).replace(/\r/g,'').split('\n').forEach(function(line){
    var m=line.match(MONEY);if(!m)return;
    var amt=Math.abs(num(m[m.length-1]));if(!(amt>0))return;
    var dm=line.match(DMY),date=iso(now);
    if(dm){var mo=isNaN(+dm[2])?MON.map(function(x){return x.toLowerCase();}).indexOf(dm[2].slice(0,3).toLowerCase()):(+dm[2]-1);var yr=dm[3]?(+dm[3]<100?2000+ +dm[3]:+dm[3]):now.getFullYear();
      if(mo>=0&&mo<12&&+dm[1]>=1&&+dm[1]<=31)date=iso(new Date(yr,mo,+dm[1]));}
    var desc=line.replace(MONEY,' ').replace(DMY,' ').replace(/[,;\t|"]+/g,' ').replace(/\b(DR|CR|SGD|S\$)\b/gi,' ').replace(/\s+/g,' ').trim()||'Payment';
    if(desc.length>40)desc=desc.slice(0,40);
    if(INCOME.test(line))out.push({id:uid(),kind:'income',date:date,amt:r2(amt),to:accId,src:/SALARY/i.test(line)?'Salary':/REFUND|CASHBACK/i.test(line)?'Refund':'Other',note:desc});
    else out.push({id:uid(),kind:'spend',date:date,amt:r2(amt),cat:catOf(desc),note:desc,from:accId});
  });
  return out;
}

/* ---------- zakat on wealth (estimate) ----------
 Rate 2.5%. Nisab = value of 86g gold as published monthly by MUIS (zakat.sg). Haul = one Hijri year (about 355 days) above nisab.
 CPF: MUIS fatwa - not complete ownership, zakat only on lump sums withdrawn. Own home and insurance plans are left out by default.
 Every row can be ticked or unticked by the user. Estimate only. */
var ZAKAT_DEFAULT={nisab:15584,nisabMonth:'Oct 2026',debts:0,haul:false,inc:{}};
function zk(){if(!D.zakat)D.zakat=JSON.parse(JSON.stringify(ZAKAT_DEFAULT));return D.zakat;}
function zDefault(a){if(a.type==='bank'||a.type==='cash')return true;if(a.type==='invest')return a.sub!=='srs';if(a.type==='asset')return a.sub==='gold'||a.sub==='owed';return false;}
function zWhy(a){if(a.type==='cpf')return 'CPF: MUIS fatwa says zakat is due on lump sums you withdraw, not on money still in CPF';if(a.type==='property')return 'Your own home is not counted';
  if(a.type==='insure')return 'Depends on the plan: use the MUIS insurance calculator';if(a.type==='invest'&&a.sub==='srs')return 'SRS: check with MUIS before counting it';
  if(a.type==='asset'&&a.sub==='business')return 'Business zakat uses its own method: see the MUIS business calculator';if(a.type==='asset')return 'Usually not counted unless held for trade';if(liab(a.type))return 'Debts are not added here. Use "Debts due now" below for anything you must pay now';return '';}
function zInc(a){var z=zk();return a.id in z.inc?z.inc[a.id]:zDefault(a);}
function zCalc(B){var z=zk(),rows=openAccts().filter(function(a){return !liab(a.type);}),total=0;
  rows.forEach(function(a){if(zInc(a))total+=Math.max(0,B.b[a.id]);});
  var base=Math.max(0,total-(z.debts||0)),above=base>=z.nisab,due=above&&z.haul?r2(base*0.025):0;return {rows:rows,total:total,base:base,above:above,due:due};}
function zakatTile(B){
  var z=zk(),c=zCalc(B),inc=c.rows.filter(zInc),exc=c.rows.filter(function(a){return !zInc(a);});
  function row(a){var on=zInc(a);return '<label class="zrow'+(on?'':' off')+'"><input type="checkbox" data-zacc="'+a.id+'"'+(on?' checked':'')+'><span><b>'+esc(a.name)+'</b>'+(on?'':'<small>'+esc(zWhy(a))+'</small>')+'</span><span class="amt">'+$(Math.max(0,B.b[a.id]))+'</span></label>';}
  var res;
  if(!c.above)res='<div class="zres no"><span class="n">$0</span><p>Your counted wealth of <b>'+$(c.base)+'</b> is below the nisab of '+$(z.nisab)+'. No zakat on savings is due.</p></div>';
  else if(!z.haul)res='<div class="zres no"><span class="n">'+$(c.base*0.025,1)+'</span><p>Would be due once your savings have stayed above the nisab for a full Hijri year. Tick the box above when that is true.</p></div>';
  else res='<div class="zres"><span class="n">'+$(c.due,1)+'</span><p>Zakat due: 2.5% of <b>'+$(c.base)+'</b>.</p></div>';
  return '<section class="tile zak full" id="zakTile"><h2>Zakat on savings</h2>'+
   '<p class="note">An estimate of zakat on your wealth (zakat harta), using the accounts you have added. Tick what counts for you. For a ruling, check with MUIS or an asatizah.</p>'+
   '<div class="two"><div class="field"><label for="zNisab">Nisab (86g gold)</label><input id="zNisab" inputmode="decimal" value="'+z.nisab+'"></div><div class="field"><label for="zDebts">Debts due now</label><input id="zDebts" inputmode="decimal" value="'+(z.debts||0)+'"></div></div>'+
   '<p class="note">'+(z.nisabMonth?'Nisab shown is MUIS\'s figure for '+esc(z.nisabMonth)+'. ':'')+'It changes every month with the gold price: check the current value at zakat.sg.</p>'+
   '<label class="zchk"><input type="checkbox" id="zHaul"'+(z.haul?' checked':'')+'><span>My savings have stayed above the nisab for a full Hijri year (about 355 days)</span></label>'+
   '<div class="zl">'+inc.map(row).join('')+'</div>'+res+
   (exc.length?'<details class="why"><summary>Not counted ('+exc.length+') and why</summary><div class="zl">'+exc.map(row).join('')+'</div></details>':'')+
   '<p class="disc">Estimate only, not a religious ruling. Business, gold and insurance can follow different rules. Confirm and pay through MUIS at zakat.sg.</p></section>';
}
